<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 50">
  <!-- Czarne lusterka boczne widoczne na zdjęciach -->
  <rect x="62" y="0" width="8" height="6" rx="2" fill="#1A1A1A"/>
  <rect x="62" y="44" width="8" height="6" rx="2" fill="#1A1A1A"/>

  <!-- Główna karoseria (czysta biel) -->
  <rect x="0" y="2" width="100" height="46" rx="22" fill="#F8F9FA"/>

  <!-- Wyprofilowanie białego dachu -->
  <rect x="25" y="6" width="45" height="38" rx="12" fill="#EEEEEE"/>

  <!-- Szyba przednia -->
  <polygon points="70,8 80,14 80,36 70,42" fill="#B3E5FC"/>

  <!-- Szyba tylna -->
  <polygon points="25,10 16,16 16,34 25,40" fill="#B3E5FC"/>
  
  <!-- Szyby boczne -->
  <polygon points="30,7 66,7 68,11 28,11" fill="#81D4FA"/>
  <polygon points="30,43 66,43 68,39 28,39" fill="#81D4FA"/>

  <!-- Okrągłe reflektory przednie -->
  <circle cx="93" cy="12" r="4" fill="#FFF59D"/>
  <circle cx="93" cy="38" r="4" fill="#FFF59D"/>
  <circle cx="98" cy="18" r="1.5" fill="#FFFFFF"/>
  <circle cx="98" cy="32" r="1.5" fill="#FFFFFF"/>

  <!-- Światła tylne -->
  <circle cx="4" cy="12" r="3" fill="#EF5350"/>
  <circle cx="4" cy="38" r="3" fill="#EF5350"/>
</svg>
